<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Chatbot LIRIS + Qdrant</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>

  <body>
    <div class="chat-container">
      <header class="chat-header">
        <div class="chat-header-icon">L</div>
        <div class="chat-header-text">
          <h1>Chatbot LIRIS + Qdrant</h1>
          <span>Base vectorial para conocimiento interno</span>
        </div>
      </header>

      <div class="toolbar">
        <label class="upload-label">
          <span class="icon">📄</span>
          <span>Adjuntar PDF</span>
          <input type="file" id="pdf-input" accept="application/pdf" hidden />
        </label>
        <div id="upload-status" class="upload-status">
          Puedes subir un PDF de LIRIS para indexarlo.
        </div>
      </div>

      <main id="messages" class="messages"></main>

      <form id="chat-form" class="input-area">
        <input
          id="message-input"
          type="text"
          autocomplete="off"
          placeholder="Escribe algo como: '¿Cuándo se fundó LIRIS?'"
        />

        <!-- Voz -->
        <button type="button" id="mic-btn" title="Hablar">🎤</button>
        <button type="button" id="voice-btn" title="Voz ON/OFF">🔊</button>

        <button type="submit">Enviar</button>
      </form>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
